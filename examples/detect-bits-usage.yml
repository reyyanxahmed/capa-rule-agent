rule:
  meta:
    name: detect BITS usage
    namespace: communication/bits
    authors:
      - gsoc-agent@mandiant.com
    scopes:
      static: function
      dynamic: span of calls
    att&ck:
      - Defense Evasion::BITS Jobs [T1197]
      - Persistence::BITS Jobs [T1197]
    references:
      - https://docs.microsoft.com/en-us/windows/win32/bits/background-intelligent-transfer-service-portal
    examples:
      - TODO
  features:
    - or:
      - and:
        - description: BITS COM interface usage
        - or:
          - api: ole32.CoCreateInstance
          - api: ole32.CoGetClassObject
        - or:
          - string: /IBackgroundCopyManager/i
          - string: /IBackgroundCopyJob/i
          - number: 0x4991d34b = BITS CLSID (part 1)
      - and:
        - description: bitsadmin CLI usage
        - or:
          - match: host-interaction/process/create
          - api: kernel32.CreateProcess
        - string: /bitsadmin/i
        - or:
          - string: "/transfer/i"
          - string: "/create/i"
          - string: "/addfile/i"
          - string: "/resume/i"
      - and:
        - description: PowerShell BITS cmdlet usage
        - or:
          - match: host-interaction/process/create
        - or:
          - string: /Start-BitsTransfer/i
          - string: /BitsTransfer/i

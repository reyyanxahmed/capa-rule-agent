name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Validate example rules (YAML syntax)
        run: |
          python -c "
          import yaml, sys, pathlib
          errors = 0
          for p in pathlib.Path('examples').rglob('*.yml'):
              try:
                  data = yaml.safe_load(p.read_text())
                  assert 'rule' in data, f'{p}: missing top-level rule key'
                  assert 'meta' in data['rule'], f'{p}: missing meta section'
                  assert 'features' in data['rule'], f'{p}: missing features section'
                  print(f'  ✓ {p}')
              except Exception as e:
                  print(f'  ✗ {p}: {e}')
                  errors += 1
          sys.exit(errors)
          "

      - name: Lint with ruff (if installed)
        run: |
          pip install ruff || true
          ruff check src/ tests/ --ignore E501 || true
